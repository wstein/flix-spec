name: Publish Maven Package

# Publishes io.github.wstein:flix-spec to a Maven repository, plus a generated landing page, on
# GitHub Pages. Tags publish an immutable release version; pushes to main publish a floating
# -SNAPSHOT build.
#
# Two roles, deliberately kept separate:
#
#   - gh-pages (a branch) is the durable, ADDITIVE accumulator. A Maven repository must keep every
#     version it has ever published coexisting, so each run checks out the existing branch (or
#     creates it) and adds this run's artifacts to what is already there, never regenerating from
#     scratch. It is also what "Refuse to Republish an Existing Release Version" checks against,
#     and it is a free, diffable publish history.
#   - actions/deploy-pages SERVES the branch's current contents. Not the "Deploy from a branch"
#     repo setting: that setting is what broke silently the first time this workflow ran -- it
#     pushed gh-pages while Pages was configured to expect an Actions deployment that never came,
#     and every URL under the site 404'd for days because nothing checked. deploy-pages is the
#     workflow performing its own deployment instead of depending on an unchecked manual setting
#     staying correct -- the same fix already applied everywhere else in this repository (assert
#     the thing, not a proxy for it).
#
# Because Actions-based Pages deployment replaces the whole site on every deploy, the artifact
# uploaded to deploy-pages must be the branch's full current tree, not just this run's additions
# -- otherwise every version but the newest would vanish from what is actually served.
#
# One-time repo setup (not automated here, and only needed once): Settings -> Pages -> Source ->
# GitHub Actions.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # contents: write pushes the gh-pages branch (the accumulator, see above).
      # pages: write and id-token: write are what actions/deploy-pages needs to
      # perform the actual deployment. All three scoped to this job only; the
      # workflow default above stays read-only.
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Cached Oracle Jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle/flix.jar
          key: oracle-jar-${{ hashFiles('pin.json') }}

      - name: Fetch Oracle Jar and Verify SHA-256
        run: ./tools/oracle/fetch.sh

      - name: Run End-to-End Verification Suite
        run: ./tools/project/verify.sh

      - name: Refuse to Publish Stale Artifacts
        # verify.sh regenerates ast/treekind.json. If regeneration moved it, we
        # would be publishing artifacts that do not match their own oracle.
        run: git diff --exit-code ast/treekind.json

      - name: Determine Publish Mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages Worktree
        # The orphan-branch path is destructive: it discards the whole publish history, including
        # every prior Maven version. It found that out the hard way -- an earlier run took this path
        # when it should not have, and the release version 0.75.1 vanished with no error, because
        # `git ls-remote` failing for *any* reason (a transient network or auth error, not just "the
        # branch does not exist") fell through to the same branch as a genuinely first-ever publish.
        #
        # `ls-remote --exit-code` distinguishes them: exit 2 means the ref genuinely does not exist
        # (safe to create fresh); any other non-zero exit is a real error and must fail loudly rather
        # than be silently treated as "branch is empty, start over."
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            git fetch origin gh-pages
            git worktree add gh-pages-worktree origin/gh-pages
          elif [ "$RC" -eq 2 ]; then
            echo "gh-pages does not exist yet; creating it fresh."
            git worktree add --detach gh-pages-worktree
            git -C gh-pages-worktree checkout --orphan gh-pages
            git -C gh-pages-worktree rm -rf . > /dev/null 2>&1 || true
          else
            echo "FATAL: git ls-remote for gh-pages failed with exit $RC, which is not" >&2
            echo "       'branch does not exist' (that is exit 2). Refusing to create an" >&2
            echo "       orphan branch, which would discard the entire publish history." >&2
            exit "$RC"
          fi

      - name: Determine Full Version
        # Asked of Gradle rather than reconstructed here a second time. This workflow used to
        # rebuild the version string by hand in two places with the old `<base>-flix<tag>`
        # formula; when packaging/build.gradle.kts stopped appending that suffix (plain semver,
        # the pin advertised rather than encoded), both copies silently kept producing the old
        # shape and nothing caught it until a resolution attempt failed on a coordinate that was
        # never published. One computation, asked of the tool that owns it, cannot drift from
        # what actually gets published.
        id: version
        run: |
          set -euo pipefail
          FULL_VERSION="$(./gradlew -q :packaging:properties \
            "-PflixSpec.snapshot=${{ steps.mode.outputs.snapshot }}" \
            | awk -F': ' '/^version:/ {print $2}')"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${FULL_VERSION}"

      - name: Refuse to Republish an Existing Release Version
        if: steps.mode.outputs.snapshot == 'false'
        run: |
          set -euo pipefail
          FULL_VERSION="${{ steps.version.outputs.full_version }}"
          DEST="gh-pages-worktree/maven/io/github/wstein/flix-spec/${FULL_VERSION}"
          if [ -d "$DEST" ]; then
            echo "FATAL: ${FULL_VERSION} is already published at ${DEST}." >&2
            echo "Releases are immutable -- bump gradle.properties' version or the pin, don't republish." >&2
            exit 1
          fi
          echo "Publishing new release version: ${FULL_VERSION}"

      - name: Publish
        run: |
          set -euo pipefail
          ./gradlew :packaging:publish \
            "-PflixSpec.snapshot=${{ steps.mode.outputs.snapshot }}" \
            "-PflixSpec.publishRepo=file://$(pwd)/gh-pages-worktree/maven"

      - name: Generate Landing Page
        # Regenerated on every publish so it never drifts from what was just published: every fact
        # on it is read from pin.json, ast/*.json, and the maven-metadata.xml this job just wrote,
        # never hand-maintained. A Gradle-invoked Scala tool (LandingPage.scala), not a shell
        # script: an earlier bash version had a prose sentence quietly reading the wrong variable
        # (coverage where it meant reachability), only coincidentally correct because the two
        # numbers matched at the time it was written. A typed render function whose parameters are
        # the facts it renders cannot make that mistake silently -- using the wrong one is a
        # compile error. See the file for why this is one plain page and not a Maven-Central-style
        # artifact browser with tabs the data here can't honestly fill.
        run: |
          set -euo pipefail
          ./gradlew -q :tools:project:generateLandingPage --args="\
            gh-pages-worktree/maven/io/github/wstein/flix-spec/maven-metadata.xml \
            gh-pages-worktree/index.html"

      - name: Commit and Push gh-pages
        id: commit
        run: |
          set -euo pipefail
          cd gh-pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven index.html
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish: ${GITHUB_REF_NAME} (${{ steps.mode.outputs.snapshot == 'true' && 'snapshot' || 'release' }})"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        if: steps.commit.outputs.changed == 'true'
        # The whole accumulated tree, not just this run's additions: Actions-based Pages
        # deployment replaces the entire site on every deploy, so what is uploaded here has to be
        # everything gh-pages now contains, including versions published by earlier runs.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages-worktree

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the Published Coordinate Actually Resolves
        # Deploying is not publishing. Resolving the coordinate from a clean Gradle project against
        # the public URL is the only step here that proves a consumer can actually obtain the
        # files -- deploy-pages reports success once GitHub has accepted the deployment, which is
        # not the same guarantee.
        #
        # Pages serves asynchronously after the deploy, so allow it time to propagate before failing.
        run: |
          set -euo pipefail
          FULL_VERSION="${{ steps.version.outputs.full_version }}"

          for attempt in $(seq 1 20); do
            if ./tools/packaging/verify-published.sh "$FULL_VERSION"; then
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt); Pages may still be propagating"
            sleep 30
          done

          echo "FATAL: $FULL_VERSION never became resolvable." >&2
          echo "       Check Settings -> Pages: source must be 'GitHub Actions'." >&2
          exit 1

      - name: Verify the Landing Page Actually Resolves
        # The same lesson, applied to index.html: a page that was pushed is not a page that is
        # served. Checked with a plain HTTP GET rather than a Gradle resolve, since it is a static
        # file rather than a Maven coordinate.
        run: |
          set -euo pipefail
          URL="https://wstein.github.io/flix-spec/"

          for attempt in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")"
            if [ "$CODE" = "200" ]; then
              echo "OK: $URL resolves"
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt, HTTP $CODE); Pages may still be building"
            sleep 30
          done

          echo "FATAL: $URL never returned 200." >&2
          exit 1
