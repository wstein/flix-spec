name: Publish Maven Package

# Publishes io.github.wstein:flix-spec to a Maven repository hosted on GitHub
# Pages, serving from the gh-pages branch (docs/VERSIONING.md). Tags publish an
# immutable release version; pushes to main publish a floating -SNAPSHOT build.
# Every publish accumulates into gh-pages -- a Maven repository is additive,
# never replaced wholesale, so this checks out the existing branch (or creates
# it) rather than regenerating it from scratch.
#
# One-time manual step (not automated here): repo Settings -> Pages -> Source
# -> Deploy from a branch -> gh-pages / (root).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Required to push the gh-pages branch. Scoped to this job only; the
      # workflow default above stays read-only.
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Cached Oracle Jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle/flix.jar
          key: oracle-jar-${{ hashFiles('pin.json') }}

      - name: Fetch Oracle Jar and Verify SHA-256
        run: ./tools/oracle/fetch.sh

      - name: Run End-to-End Verification Suite
        run: ./tools/project/verify.sh

      - name: Refuse to Publish Stale Artifacts
        # verify.sh regenerates ast/treekind.json. If regeneration moved it, we
        # would be publishing artifacts that do not match their own oracle.
        run: git diff --exit-code ast/treekind.json

      - name: Determine Publish Mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages Worktree
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add gh-pages-worktree origin/gh-pages
          else
            git worktree add --detach gh-pages-worktree
            git -C gh-pages-worktree checkout --orphan gh-pages
            git -C gh-pages-worktree rm -rf . > /dev/null 2>&1 || true
          fi

      - name: Refuse to Republish an Existing Release Version
        if: steps.mode.outputs.snapshot == 'false'
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep '^version=' gradle.properties | cut -d= -f2)"
          FLIX_TAG="$(jq -r '.upstream.tag' pin.json)"
          FULL_VERSION="${BASE_VERSION}-flix${FLIX_TAG#v}"
          DEST="gh-pages-worktree/maven/io/github/wstein/flix-spec/${FULL_VERSION}"
          if [ -d "$DEST" ]; then
            echo "FATAL: ${FULL_VERSION} is already published at ${DEST}." >&2
            echo "Releases are immutable -- bump gradle.properties' version or the pin, don't republish." >&2
            exit 1
          fi
          echo "Publishing new release version: ${FULL_VERSION}"

      - name: Publish
        run: |
          set -euo pipefail
          ./gradlew :packaging:publish \
            "-PflixSpec.snapshot=${{ steps.mode.outputs.snapshot }}" \
            "-PflixSpec.publishRepo=file://$(pwd)/gh-pages-worktree/maven"

      - name: Commit and Push gh-pages
        run: |
          set -euo pipefail
          cd gh-pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "publish: ${GITHUB_REF_NAME} (${{ steps.mode.outputs.snapshot == 'true' && 'snapshot' || 'release' }})"
          git push origin HEAD:gh-pages

      - name: Verify the Published Coordinate Actually Resolves
        # Pushing gh-pages is not publishing. This repository served 404 on every URL for days
        # while this job reported success, because Pages was configured to expect an Actions
        # deployment and never received one. Resolving the coordinate from a clean Gradle project
        # against the public URL is the only step here that proves a consumer can obtain the files.
        #
        # Pages serves asynchronously after the push, so allow it time to build before failing.
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          FLIX_TAG="$(jq -r '.upstream.tag' pin.json)"
          FULL_VERSION="${BASE_VERSION}-flix${FLIX_TAG#v}"
          if [ "${{ steps.mode.outputs.snapshot }}" = "true" ]; then
            FULL_VERSION="${FULL_VERSION}-SNAPSHOT"
          fi

          for attempt in $(seq 1 20); do
            if ./tools/packaging/verify-published.sh "$FULL_VERSION"; then
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt); Pages may still be building"
            sleep 30
          done

          echo "FATAL: $FULL_VERSION never became resolvable." >&2
          echo "       Check Settings -> Pages: source must be 'Deploy from a branch' -> gh-pages / (root)." >&2
          exit 1
