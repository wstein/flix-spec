name: Oracle Artifact Verification

on:
  push:
    paths:
      - 'pin.json'
      - '.github/workflows/oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-verify-oracle:
    name: Fetch and Cache Oracle Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java JDK 21
        uses: actions/setup-java@3a47288d29edd610052991036079c6565f1262d1 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fetch Oracle Jar and Verify SHA-256
        run: ./tools/oracle/fetch.sh

      - name: Cache Verified Oracle Jar
        uses: actions/cache@d4323d4df104b026a6ec633f211e3165443a32b6 # v4.2.2
        with:
          path: .oracle/flix.jar
          key: oracle-jar-${{ hashFiles('pin.json') }}
