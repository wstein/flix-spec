name: Fast Tier Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tier-verification:
    name: Re-extract, Diff & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Cached Oracle Jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle/flix.jar
          key: oracle-jar-${{ hashFiles('pin.json') }}

      - name: Ensure Oracle Jar Present
        run: ./tools/oracle/fetch.sh

      - name: Run Formatter Check
        run: ./gradlew spotlessCheck

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run End-to-End Verification Suite
        run: ./tools/project/verify.sh

      - name: Verify Generated Artifacts Are Current
        # verify.sh already regenerated everything. Any diff means a committed
        # artifact does not match what the pinned oracle actually produces.
        run: git diff --exit-code ast/ fixtures/expected/
