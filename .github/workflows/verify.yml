name: Fast Tier Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tier-verification:
    name: Re-extract, Diff & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Cached Oracle Jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle/flix.jar
          key: oracle-jar-${{ hashFiles('pin.json') }}

      - name: Ensure Oracle Jar Present
        run: ./tools/oracle/fetch.sh

      - name: Run Formatter Check
        run: ./gradlew spotlessCheck

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run End-to-End Verification Suite
        run: ./tools/project/verify.sh

      - name: Test Published Runner Outside Checkout
        run: |
          ./gradlew :packaging:publishFlixSpecPublicationToFlixSpecRepoRepository \
            :tools:conformance:publishRunnerPublicationToFlixSpecRepoRepository \
            "-PflixSpec.publishRepo=file://$(pwd)/build/runner-acceptance-repo"
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          bash tools/runner/acceptance.sh build/runner-acceptance-repo "$VERSION"

      - name: Verify Generated Artifacts Are Current
        # verify.sh already regenerated everything. Any diff means a committed
        # artifact does not match what the pinned oracle actually produces.
        run: |
          # --exit-code alone ignores untracked files, so a newly generated
          # artifact that was never committed would pass silently.
          #
          # README.md and docs/CONFORMANCE.md are in scope because their
          # "<!-- generated: ... -->" blocks are artifacts too. Leaving prose
          # outside this gate is exactly how the fixture count reached 136 on
          # disk while the README still advertised 134.
          #
          # NOTICE.md is in scope because its provenance block is generated from pin.json and it ships
          # inside both the release bundle and the Maven jar. It named v0.76.0 and that release's digest
          # for two pins after the oracle had moved, in every consumer's copy, because nothing compared it.
          #
          # fixtures/raw/ is in scope for the same reason fixtures/expected/ is:
          # it is a committed, published artifact, and it is the authority the
          # recovery lane compares against. Gating only the normalized form
          # would let the reference's own tree drift silently.
          git add --intent-to-add --all \
            ast/ fixtures/raw/ fixtures/expected/ README.md docs/CONFORMANCE.md docs/DEFECTS.md NOTICE.md
          git diff --exit-code \
            ast/ fixtures/raw/ fixtures/expected/ README.md docs/CONFORMANCE.md docs/DEFECTS.md NOTICE.md
